<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive · PV Info</title>
  <meta name="description" content="Search every pharmacovigilance and regulatory update PV Info has collected, beyond the last 60 days.">
  <meta name="theme-color" content="#0f4c5c">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <!-- Vercel Web Analytics and Speed Insights (enable both in the Vercel dashboard) -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };</script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="./"><img src="icon.svg" alt="" width="28" height="28"><span>PV Info</span></a>
    <p class="tagline">What changed, why it matters, and what your team should review</p>
    <button type="button" class="menu-btn" aria-controls="site-nav" aria-expanded="false">Menu</button>
    <nav class="toplinks" id="site-nav" aria-label="Main">
      <a href="./">Updates</a>
      <a href="briefing.html">My Briefing</a>
      <a href="research.html">Research</a>
      <a href="companies.html">Companies</a>
      <a href="team.html" data-nav="team">Team</a>
      <a href="archive.html">Archive</a>
      <a href="globe.html">Globe</a>
      <a href="agencies.html">Agencies</a>
      <a href="about.html">About</a>
      <a href="account.html" class="signin" data-nav="account">Sign in</a>
    </nav>
  </header>

  <main class="page brief">
    <h1>Archive</h1>
    <p class="intro" id="lede">Loading…</p>
    <form class="profile archive-form" id="form" hidden>
      <div class="row">
        <input type="search" id="q" placeholder="Words in the title or summary, e.g. valproate, &quot;E2B(R3)&quot;" aria-label="Search words">
        <select id="country" aria-label="Country"><option value="">All countries</option></select>
        <select id="cat" aria-label="Topic"><option value="">All topics</option></select>
        <select id="kind" aria-label="Source type"><option value="">Official and news</option><option value="official">Official only</option><option value="news">News only</option></select>
      </div>
      <div class="row">
        <label class="inline">From <input type="date" id="from"></label>
        <label class="inline">To <input type="date" id="to"></label>
        <button type="submit" class="primary">Search</button>
        <button type="reset">Clear</button>
      </div>
    </form>
    <p class="hint" id="count" role="status"></p>
    <div id="list"></div>
    <button type="button" class="more" id="more" hidden>Show more</button>
  </main>

  <script type="module" src="archive.js"></script>
  <script type="module" src="chat.js"></script>
  <script type="module" src="nav.js"></script>
</body>
</html>
