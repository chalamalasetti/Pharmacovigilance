name: Collect official FDA feeds
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this main revision refreshed within 50 minutes
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/fda-snapshot.mjs'
      - 'scripts/refresh-gate.cjs'
      - '.github/workflows/fda-collector.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: fda-feed-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Coalesce duplicate scheduled and dispatched refreshes
        id: refresh_gate
        uses: actions/github-script@v7
        with:
          script: |
            const runs = (await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id:'fda-collector.yml', status:'success', per_page:20})).data.workflow_runs;
            // A skipped duplicate run is also green: only an actual successful hook step counts.
            for (const run of runs.filter(r => r.head_sha === context.sha && Date.now() - Date.parse(r.created_at) < 50*60*1000)) {
              const jobs = (await github.rest.actions.listJobsForWorkflowRun({...context.repo, run_id:run.id})).data.jobs;
              run.refreshed = jobs.some(j => j.steps?.some(s => s.name === 'Rebuild Vercel after snapshot publication' && s.conclusion === 'success'));
            }
            const decision = require('./scripts/refresh-gate.cjs')({runs, headSha:context.sha, eventName:context.eventName, force:context.payload.inputs?.force === 'true' || context.payload.inputs?.force === true});
            core.setOutput('run', String(decision.run));
            core.notice(decision.reason);
      - run: npm ci --ignore-scripts
        if: steps.refresh_gate.outputs.run == 'true'
      - name: Read previous snapshot
        if: steps.refresh_gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const r = await github.rest.repos.getContent({...context.repo, path:'fda-feeds.json', ref:'fda-feed-cache'});
              fs.writeFileSync('/tmp/previous-fda.json', Buffer.from(r.data.content, 'base64'));
            } catch (e) { if (e.status !== 404) throw e; }
      - name: Collect from FDA using active source settings
        if: steps.refresh_gate.outputs.run == 'true'
        run: node scripts/fda-snapshot.mjs /tmp/fda-feeds.json /tmp/previous-fda.json
      - name: Publish sanitized snapshot
        if: steps.refresh_gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'fda-feed-cache';
            try { await github.rest.git.getRef({...context.repo, ref:`heads/${branch}`}); }
            catch(e) {
              if(e.status !== 404) throw e;
              await github.rest.git.createRef({...context.repo, ref:`refs/heads/${branch}`, sha:context.sha});
            }
            let sha;
            try { sha = (await github.rest.repos.getContent({...context.repo, path:'fda-feeds.json', ref:branch})).data.sha; }
            catch(e) { if(e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({...context.repo, branch, path:'fda-feeds.json', sha,
              message:'Refresh privacy-screened official FDA feeds', content:fs.readFileSync('/tmp/fda-feeds.json').toString('base64')});
      - name: Rebuild Vercel after snapshot publication
        if: steps.refresh_gate.outputs.run == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; fi
