name: Refresh public PV data
on:
  schedule:
    # Wake hourly; the database lease runs collection only when its 12-hour interval is due.
    # An hourly catch-up also retries failed/delayed collections without a site deployment.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Refresh data immediately even if paused or not due
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/fda-snapshot.mjs'
      - 'scripts/refresh-gate.cjs'
      - '.github/workflows/fda-collector.yml'
      - 'scripts/runtime-*.mjs'
      - 'api/data-refresh.js'
permissions:
  contents: write
  actions: read
  id-token: write
concurrency:
  group: fda-feed-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check managed schedule and acquire run lease
        id: managed
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node scripts/refresh-control.mjs claim updates
      - name: Read current publication settings
        if: steps.managed.outputs.run == 'true'
        env:
          RUN_LEASE: ${{ steps.managed.outputs.lease }}
        run: node scripts/runtime-collect.mjs prepare
      - name: Read latest product cache
        if: steps.managed.outputs.run == 'true'
        run: bash scripts/read-product-cache.sh
      - name: Read previous snapshot
        if: steps.managed.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const r = await github.rest.repos.getContent({...context.repo, path:'fda-feeds.json', ref:'fda-feed-cache'});
              fs.writeFileSync('/tmp/previous-fda.json', Buffer.from(r.data.content, 'base64'));
            } catch (e) { if (e.status !== 404) throw e; }
      - name: Collect from FDA using active source settings
        id: collect
        if: steps.managed.outputs.run == 'true'
        env:
          PV_REGISTRY_PATH: /tmp/runtime-source-registry.json
        run: node scripts/fda-snapshot.mjs /tmp/fda-feeds.json /tmp/previous-fda.json
      - name: Publish sanitized snapshot
        if: steps.managed.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const branch = 'fda-feed-cache';
            try { await github.rest.git.getRef({...context.repo, ref:`heads/${branch}`}); }
            catch(e) {
              if(e.status !== 404) throw e;
              await github.rest.git.createRef({...context.repo, ref:`refs/heads/${branch}`, sha:context.sha});
            }
            let sha;
            try { sha = (await github.rest.repos.getContent({...context.repo, path:'fda-feeds.json', ref:branch})).data.sha; }
            catch(e) { if(e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({...context.repo, branch, path:'fda-feeds.json', sha,
              message:'Refresh privacy-screened official FDA feeds', content:fs.readFileSync('/tmp/fda-feeds.json').toString('base64')});
      - name: Publish complete runtime data snapshot
        id: publish
        if: steps.managed.outputs.run == 'true'
        env:
          RUN_LEASE: ${{ steps.managed.outputs.lease }}
          REFRESH_MINUTES: ${{ steps.managed.outputs.frequency }}
        run: node scripts/runtime-collect.mjs
      - name: Record managed collection outcome
        if: always() && steps.managed.outputs.run == 'true'
        env:
          RUN_LEASE: ${{ steps.managed.outputs.lease }}
          RUN_RESULT: ${{ steps.collect.outcome }}
          PUBLICATION: ${{ steps.publish.outcome }}
        run: node scripts/refresh-control.mjs finish updates
