name: Refresh company registry

# Product refreshes stage data on a non-deploying cache branch.
# Completion queues the updates pipeline, which publishes a complete runtime snapshot.

on:
  push:
    branches: [main]
    paths: ['scripts/registry.mjs', '.github/workflows/company-registry.yml']
  schedule:
    - cron: "9,24,39,54 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run immediately even if paused or not due
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: company-registry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check managed schedule and acquire run lease
        id: managed
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node scripts/refresh-control.mjs claim products
      - name: Read previous product data
        if: steps.managed.outputs.run == 'true'
        run: bash scripts/read-product-cache.sh
      - name: Build the registry
        id: collect
        if: steps.managed.outputs.run == 'true'
        run: |
          npm run registry
          cp companies/registry.json /tmp/refresh-products-result.json
      - name: Stage product registry without an app deployment
        id: publish
        if: steps.managed.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), branch = 'product-data-cache';
            try { await github.rest.git.getRef({...context.repo, ref:`heads/${branch}`}); }
            catch(e) { if(e.status !== 404) throw e; await github.rest.git.createRef({...context.repo,ref:`refs/heads/${branch}`,sha:context.sha}); }
            const ref=await github.rest.git.getRef({...context.repo,ref:`heads/${branch}`});
            const base=await github.rest.git.getCommit({...context.repo,commit_sha:ref.data.object.sha});
            const tree=[];
            for(const [local,remote] of [['companies/registry.json','registry.json'],['companies/substance-products.json','substance-products.json']]){
              const blob=await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(local).toString('base64'),encoding:'base64'});
              tree.push({path:remote,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            const t=await github.rest.git.createTree({...context.repo,base_tree:base.data.tree.sha,tree});
            const c=await github.rest.git.createCommit({...context.repo,message:'Stage company and substance source products atomically',tree:t.data.sha,parents:[base.data.sha]});
            await github.rest.git.updateRef({...context.repo,ref:`heads/${branch}`,sha:c.data.sha,force:false});
      - name: Record managed collection outcome
        if: always() && steps.managed.outputs.run == 'true'
        env:
          RUN_LEASE: ${{ steps.managed.outputs.lease }}
          RUN_RESULT: ${{ steps.collect.outcome }}
          PUBLICATION: ${{ steps.publish.outcome }}
        run: node scripts/refresh-control.mjs finish products
