name: Refresh company registry

# Checks the admin-managed schedule every 15 minutes (weekly collection by default).
# Downloads FDA Orange Book and EMA medicines data, links each record
# to a company in companies/manifest.json (scripts/registry.mjs), and commits
# companies/registry.json when it changed. That push redeploys the site. The hourly
# builds only read the committed file, so a source outage never empties a company page.
# Free: uses only the built-in GITHUB_TOKEN. Run it by hand from the Actions tab too.

on:
  schedule:
    - cron: "9,24,39,54 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run immediately even if paused or not due
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: company-registry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check managed schedule and acquire run lease
        id: managed
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node scripts/refresh-control.mjs claim products
      - name: Build the registry
        id: collect
        if: steps.managed.outputs.run == 'true'
        run: |
          npm run registry
          cp companies/registry.json /tmp/refresh-products-result.json
      - name: Commit if changed
        id: publish
        if: steps.managed.outputs.run == 'true'
        run: |
          if git diff --quiet -- companies/registry.json && git ls-files --error-unmatch companies/registry.json >/dev/null 2>&1; then
            echo "Registry unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add companies/registry.json
          git commit -m "Refresh company registry from FDA and EMA data"
          git push
      - name: Record managed collection outcome
        if: always() && steps.managed.outputs.run == 'true'
        env:
          RUN_LEASE: ${{ steps.managed.outputs.lease }}
          RUN_RESULT: ${{ steps.collect.outcome }}
          PUBLICATION: ${{ steps.publish.outcome }}
        run: node scripts/refresh-control.mjs finish products
