name: Collect regulatory source documents
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/documents.yml'
      - 'scripts/document*.mjs'
      - 'scripts/document-snapshot-publish.cjs'
      - 'api/document-collect.js'
      - 'public/documents-lib.js'
permissions:
  contents: write
  id-token: write
concurrency:
  group: pv-regulatory-documents
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Load previous public extraction index
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            fs.mkdirSync('/tmp/pv-document-snapshots', {recursive:true});
            try {
              const r = await github.rest.repos.getContent({...context.repo, path:'index.json', ref:'regulatory-document-cache'});
              fs.writeFileSync('/tmp/pv-document-snapshots/index.json', Buffer.from(r.data.content, 'base64'));
            } catch(e) { if(e.status !== 404) throw e; }
      - name: Collect official public copies and deliver using short-lived GitHub identity
        run: node scripts/document-collector.mjs --snapshot-dir=/tmp/pv-document-snapshots
      - name: Publish public key information even when some sources fail
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            if (!fs.existsSync('/tmp/pv-document-snapshots/index.json')) return;
            await require('./scripts/document-snapshot-publish.cjs')({github, context, directory:'/tmp/pv-document-snapshots'});
