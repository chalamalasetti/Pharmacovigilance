name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Shows which regulator feeds and news searches are reachable and how many
      # updates each gives. Informational only: a dead feed shouldn't block a merge.
      - name: Live feed check
        continue-on-error: true
        run: npm run aggregate
      - name: Official document reachability (read-only; no ingestion)
        continue-on-error: true
        run: npm run documents:probe
      # Shows whether the FDA Orange Book and EMA downloads still parse. Informational:
      # the weekly registry workflow is what updates the committed registry.
      - name: Company registry source check
        continue-on-error: true
        run: npm run registry

  company-browser:
    # Keep this OS compatible with the pinned Playwright browser/dependency bundle.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install chromium
        timeout-minutes: 5
      - name: Company briefing desktop and mobile journey (synthetic fixtures only)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npm run content:bundle
          node test/browser/content-studio.smoke.cjs
          node test/browser/sandbox.smoke.cjs
          node test/browser/admin-social.smoke.cjs
          node test/browser/pv-roles.smoke.cjs
          node test/browser/impact-briefs.smoke.cjs
          node test/browser/regulatory-calendar.smoke.cjs
          node test/browser/guidance-impact.smoke.cjs
          node test/browser/e2b-studio.smoke.cjs
          node test/browser/product-answers.smoke.cjs
          node test/browser/label-analysis.smoke.cjs
          node test/browser/label-history.smoke.cjs
          node test/browser/us-label-journey.smoke.cjs
          node test/browser/label-question.smoke.cjs
          node test/browser/product-intelligence.smoke.cjs
          node test/browser/data-repository.smoke.cjs
          node test/browser/rule-templates.smoke.cjs
          node test/browser/config-workbench.smoke.cjs
          node test/browser/leadership.smoke.cjs
          node test/browser/control-tower.smoke.cjs
          node test/browser/drug-resolver.smoke.cjs
          node test/browser/safety-topics.smoke.cjs
          node test/browser/labels.smoke.cjs
          node test/browser/substances.smoke.cjs
          node test/browser/brand.smoke.cjs
          node test/browser/user-guide.smoke.cjs
          node test/browser/runtime-data.smoke.cjs
          node test/browser/baseline-ingestion.smoke.cjs
          node test/browser/discovery.smoke.cjs
          node test/browser/pending-browsing.smoke.cjs
          node test/browser/self-signup.smoke.cjs
          node test/browser/managed-accounts.smoke.cjs
