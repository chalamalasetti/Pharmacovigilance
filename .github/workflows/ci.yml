name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Shows which regulator feeds and news searches are reachable and how many
      # updates each gives. Informational only: a dead feed shouldn't block a merge.
      - name: Live feed check
        continue-on-error: true
        run: npm run aggregate
