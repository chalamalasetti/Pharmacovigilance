name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Shows which regulator feeds and news searches are reachable and how many
      # updates each gives. Informational only: a dead feed shouldn't block a merge.
      - name: Live feed check
        continue-on-error: true
        run: npm run aggregate
      # Shows whether the FDA Orange Book and EMA downloads still parse. Informational:
      # the weekly registry workflow is what updates the committed registry.
      - name: Company registry source check
        continue-on-error: true
        run: npm run registry

  company-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Company briefing desktop and mobile journey (synthetic fixtures only)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node test/browser/company-briefing.smoke.cjs

  regulator-collector-check:
    # External availability is informational; unit/browser checks remain blocking.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Read-only live check; no cache publication, credentials or deployment hook.
      - run: node scripts/fda-snapshot.mjs /tmp/regulator-check.json
      - name: Verify TGA collection from GitHub runner
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const d=JSON.parse(readFileSync('/tmp/regulator-check.json')); const e=d.entries.find(x=>x.id==='tga-safety-alerts'); if(!e?.ok) throw new Error('TGA live collection failed; do not claim restored delivery'); console.log('TGA: '+e.items.length+' validated official items');"
