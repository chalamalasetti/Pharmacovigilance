name: Refresh updates on Vercel

# Manual rebuild. The hourly FDA collector now triggers this same deploy hook
# after publishing its snapshot, so each scheduled refresh sees the latest FDA data.
# Set the hook URL as the repo secret VERCEL_DEPLOY_HOOK (see README).

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK secret is not set yet; skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
