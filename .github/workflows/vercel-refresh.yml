name: Request public data refresh
on:
  workflow_dispatch:
permissions:
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Start data-only refresh
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id:'fda-collector.yml',ref:'main',inputs:{force:'true'}});
